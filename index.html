<style>
  :root {
    --bg: #0a0a0a;
    --tile: #e8e6e1;
    --text: #f2f0eb;
    --dim: #9a978f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;   /* stop iOS inflating text in landscape */
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "American Typewriter", "Courier New", Courier, monospace;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;               /* the full-width name can round up a pixel */
    -webkit-tap-highlight-color: transparent;
  }

  /* ============ LANDING / COVER ============ */
  .cover {
    min-height: 100vh;
    min-height: 100svh;   /* ignores the phone's collapsing address bar */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px 64px;
    position: relative;
  }
  .cover img {
    max-width: min(900px, 94vw);
    max-height: 90vh;
    width: auto;
    height: auto;
    display: block;
  }
  .scroll-hint {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--dim);
    text-decoration: none;
    animation: bob 2.4s ease-in-out infinite;
  }
  .scroll-hint:hover { color: var(--text); }
  @keyframes bob {
    0%, 100% { transform: translate(-50%, 0); }
    50%      { transform: translate(-50%, 6px); }
  }

  /* ============ HEADER ============ */
  header {
    max-width: 1320px;
    margin: 0 auto;
    padding: 80px 40px 30px;
    text-align: center;
  }
  /* the name spans the full width of the page — sized by fitName() below */
  header h1 {
    font-weight: 400;
    font-size: 90px;          /* placeholder; JS scales it to fit exactly */
    line-height: 1;
    letter-spacing: 0;
    text-transform: uppercase;
    white-space: nowrap;
  }
  header .tagline {
    margin-top: 20px;
    font-size: 14px;
    color: var(--dim);
  }
  header .work {
    margin-top: 30px;
    font-size: 13px;
    line-height: 1.75;
    color: var(--text);
  }
  header .work span { display: block; color: var(--dim); margin-bottom: 4px; }

  /* ============ GRID ============ */
  .grid {
    max-width: 1320px;
    margin: 0 auto;
    padding: 80px 40px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 34px;
  }
  .tile {
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    color: var(--text);
    font-family: inherit;
  }
  .tile .frame {
    background: var(--tile);
    aspect-ratio: 3 / 4;
    overflow: hidden;
    position: relative;
  }
  .tile img, .tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .45s ease;
    transform: scale(var(--zoom, 1));
  }
  /* project name washes over the frame on hover */
  .tile .label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    background: rgba(8, 8, 8, .48);
    color: var(--text);
    font-size: 14px;
    letter-spacing: 3px;
    line-height: 1.4;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity .32s ease;
    pointer-events: none;
  }
  .tile:focus-visible .label { opacity: 1; }

  /* mouse: reveal on hover */
  @media (hover: hover) {
    .tile:hover img, .tile:hover video { transform: scale(calc(var(--zoom, 1) * 1.035)); }
    .tile:hover .label { opacity: 1; }
  }

  /* touch: there is no hover, so the name sits under each picture instead */
  @media (hover: none) {
    .tile .label {
      opacity: 1;
      align-items: flex-end;
      justify-content: flex-start;
      text-align: left;
      padding: 10px 11px;
      font-size: 11px;
      letter-spacing: 1.5px;
      background: linear-gradient(to top,
                  rgba(8,8,8,.78) 0%, rgba(8,8,8,.35) 42%, rgba(8,8,8,0) 72%);
    }
  }

  footer {
    max-width: 1320px;
    margin: 0 auto;
    padding: 40px 40px 70px;
    font-size: 12px;
    line-height: 1.9;
    color: var(--dim);

    line-height: 1;

    height: auto;

    max-height: 100%;
    display: block;
    user-select: none;
    transition: opacity .18s ease;

  .lb-spinner {

    width: 26px; height: 26px;

    pointer-events: none;

  .lb-arrow {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 70px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--dim);
    font-size: 30px;
    font-family: inherit;
    transition: color .2s;
    z-index: 2;
  }
  .lb-arrow:hover { color: #fff; }
  .lb-prev { left: 0; }
  .lb-next { right: 0; }

  .lb-caption {
    flex: 0 0 auto;
    padding: 18px 24px 26px;
    max-width: 760px;
  }
  .lb-caption h2 {
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;

  .lb-caption p {
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.65;
    color: var(--dim);

  /* ---------- tablet ---------- */

    .tile { order: var(--m-order, 0); }

    .lb-counter { font-size: 11px; }

    .cover { min-height: auto; padding: 24px 16px 44px; }
    .cover img { max-height: 78vh; }
    .lb-caption { padding: 8px 16px 12px; }
    .lb-caption p { max-height: 16vh; }
  }

/* ---------- stretch the name to the full page width ---------- */
function fitName() {
  const el = document.getElementById("name");
  const header = el.parentElement;
  const cs = getComputedStyle(header);
  const avail = header.clientWidth
              - parseFloat(cs.paddingLeft)
              - parseFloat(cs.paddingRight);
  const BASE = 100;
  el.style.fontSize = BASE + "px";
  const natural = el.scrollWidth;
  if (natural > 0) el.style.fontSize = (BASE * avail / natural) + "px";
}
fitName();
window.addEventListener("resize", fitName);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitName);

const isVideo = f => /\.(mp4|mov|webm)$/i.test(f);

/* Escapes a file path for use in a URL, one folder at a time. This has to
   be per-segment: filenames here contain "#" and "?" characters, which a
   plain encodeURI() leaves alone and the browser then reads as the start
   of an anchor or query — so the picture never loads. */
const encPath = s => s.split("/").map(encodeURIComponent).join("/");

/* Photos come from the lightweight WEB copies; videos and any
   root-relative path are used as-is. */
function mediaSrc(p, f) {
  if (f.indexOf("/") !== -1) return encPath(f);
  if (isVideo(f)) return encPath("PICTURES/" + p.folder + "/" + f);
  return encPath("WEB/" + p.folder + "/" + f.replace(/\.[^.]+$/, ".jpg"));
}

  btn.className = "tile" + (p.coverVideo ? " tile--video" : "");
  btn.setAttribute("aria-label", p.title);
  const media = p.coverVideo
    ? '<video src="' + encPath(p.coverVideo) + '"' +
      (p.coverPoster ? ' poster="' + encPath(p.coverPoster) + '"' : '') +
      ' autoplay muted loop playsinline preload="metadata"></video>'
    : '<img loading="lazy" src="' + encPath(p.cover) + '" alt="' + p.title + '">';
  btn.innerHTML = '<div class="frame">' + media +
                  '<span class="label">' + p.title + '</span></div>';
  if (p.coverZoom) btn.style.setProperty("--zoom", p.coverZoom);
  if (p.mobileOrder) btn.style.setProperty("--m-order", p.mobileOrder);
  btn.addEventListener("click", () => openLightbox(pi, 0));
  grid.appendChild(btn);
});

/* Browsers stop offscreen clips (and sometimes never start them).
   Play a tile's clip while it's on screen, pause it when it isn't. */
const tileVideos = document.querySelectorAll(".tile video");
if (tileVideos.length) {
  const play = v => { const r = v.play(); if (r && r.catch) r.catch(() => {}); };
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => e.isIntersecting ? play(e.target) : e.target.pause());
    }, { rootMargin: "200px" });
    tileVideos.forEach(v => io.observe(v));
  } else {
    tileVideos.forEach(play);
  }
  // some browsers pause muted loops when the tab is backgrounded
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !lb.classList.contains("open")) tileVideos.forEach(play);
  });
}

/* ---------- lightbox ---------- */
const lb        = document.getElementById("lightbox");
const lbStage   = document.getElementById("lbStage");
const lbImg     = document.getElementById("lbImg");
const lbVideo   = document.getElementById("lbVideo");
const lbCounter = document.getElementById("lbCounter");
const lbTitle   = document.getElementById("lbTitle");
const lbDesc    = document.getElementById("lbDesc");

let cur = { p: 0, i: 0 };
let token = 0;            // guards against a slow load overwriting a newer one
const cache = new Map();  // src -> decoded Image, so revisits are instant

function preload(src) {
  if (cache.has(src)) return cache.get(src);
  const done = new Promise(resolve => {
    const img = new Image();
    let settled = false;
    const finish = () => { if (!settled) { settled = true; resolve(img); } };
    img.onload = () => {
      // decoding ahead of time avoids a flash, but it can stall (e.g. while
      // the tab is in the background) — so it must never block the swap
      if (img.decode) { img.decode().then(finish, finish); setTimeout(finish, 250); }
      else finish();
    };
    img.onerror = finish;
    setTimeout(finish, 10000);   // last-resort guard: never spin forever
    img.src = src;
  });
  cache.set(src, done);
  return done;
}

function openLightbox(pi, ii) {
  cur = { p: pi, i: ii };
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
  render();
}

function closeLightbox() {
  token++;                       // cancel anything still loading
  lb.classList.remove("open");
  lbStage.classList.remove("loading");
  lbVideo.pause();
  lbVideo.removeAttribute("src");
  lbVideo.load();
  document.body.style.overflow = "";
}

function render() {
  const p    = PROJECTS[cur.p];
  const file = p.images[cur.i];
  const src  = mediaSrc(p, file);
  const mine = ++token;

  lbCounter.textContent = (cur.i + 1) + " / " + p.images.length;
  lbTitle.textContent   = p.title;
  lbDesc.textContent    = p.description;

  if (isVideo(file)) {
    lbStage.classList.remove("loading");
    lbImg.style.display   = "none";
    lbImg.removeAttribute("src");
    lbVideo.style.display = "block";
    lbVideo.src = src;
  } else {
    lbVideo.pause();
    lbVideo.style.display = "none";
    lbVideo.removeAttribute("src");
    lbStage.classList.add("loading");

    preload(src).then(() => {
      if (mine !== token) return;              // a newer image won the race
      lbImg.src = src;
      lbImg.alt = p.title + " — image " + (cur.i + 1);
      lbImg.style.display = "block";
      lbStage.classList.remove("loading");
    });
  }

  // warm the neighbours so arrowing through is instant
  [cur.i + 1, cur.i - 1].forEach(n => {
    const f = p.images[(n + p.images.length) % p.images.length];
    if (f && !isVideo(f)) preload(mediaSrc(p, f));
  });
}

function step(d) {
  const n = PROJECTS[cur.p].images.length;
  cur.i = (cur.i + d + n) % n;
  render();
}

document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbPrev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
document.getElementById("lbNext").addEventListener("click", e => { e.stopPropagation(); step(1); });
lbStage.addEventListener("click", e => { if (e.target === lbStage) closeLightbox(); });
lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });

document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape")     closeLightbox();
  if (e.key === "ArrowLeft")  step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* swipe on touch screens — bound to the picture area only, so scrolling the
   description and using the video controls still work normally */
let touchX = null, touchY = null;
lbStage.addEventListener("touchstart", e => {
  if (e.touches.length !== 1 || e.target.tagName === "VIDEO") { touchX = null; return; }
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, { passive: true });
lbStage.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  // must be a clearly sideways flick, not a vertical drag
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  touchX = null;
}, { passive: true });
</script>
</body>
